<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5f0"><title>FORM · Finn din by</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap');
:root{--ink:#142322;--muted:#64716d;--paper:#f7f5f0;--card:#fff;--line:#dfe4df;--accent:#386c5c;--accent-light:#e3efe8;--warm:#f4ddbe;--radius:25px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;transition:background .6s,color .6s}button,input{font:inherit}button{cursor:pointer}button:focus-visible{outline:3px solid #e4a453;outline-offset:3px}.shell{max-width:1160px;margin:auto;padding:22px 26px 60px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:800 29px 'Outfit',sans-serif;letter-spacing:-1.5px}.brand:after{content:'';display:block;height:4px;width:65px;border-radius:5px;background:linear-gradient(90deg,#bc70ba,#72bdb0);transform:rotate(-4deg)}.navright{display:flex;align-items:center;gap:13px;font-size:12px;color:var(--muted)}.tag{border:1px solid var(--line);padding:7px 11px;border-radius:30px}.restart{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px}.progress{display:flex;gap:8px;margin:40px 0 33px}.progress span{height:4px;flex:1;background:#e2e6e0;border-radius:8px;transition:background .3s}.progress span.on{background:var(--accent)}.stage{animation:enter .48s cubic-bezier(.18,.78,.2,1) both}@keyframes enter{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--accent);margin-bottom:14px}h1,h2,h3,p{margin-top:0}h1{font:600 clamp(39px,6vw,77px)/1.03 'Outfit',sans-serif;letter-spacing:-2.8px;max-width:920px;margin-bottom:19px}h2{font:600 clamp(31px,4vw,50px)/1.1 'Outfit',sans-serif;letter-spacing:-1.6px}p.lead{font-size:17px;line-height:1.6;color:var(--muted);max-width:670px;margin-bottom:28px}.hero{padding:38px 0 12px}.optionGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.choice{background:white;border:1.5px solid var(--line);border-radius:var(--radius);padding:28px 24px;text-align:left;min-height:190px;transition:transform .25s,border-color .25s,box-shadow .25s,background .25s;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}.choice:hover{transform:translateY(-3px);border-color:#9aafa4;box-shadow:0 12px 25px #182b2310}.choice.selected{border:2px solid var(--accent);background:var(--accent-light)}.choice .ico{font-size:33px}.choice strong{display:block;font:600 23px 'Outfit',sans-serif;margin:8px 0 4px}.choice small{font-size:13px;line-height:1.5;color:var(--muted)}.choice.disabled{opacity:.5}.actions{display:flex;align-items:center;gap:12px;margin-top:27px}.btn{border:0;border-radius:40px;padding:15px 23px;background:var(--ink);color:white;font-weight:700;transition:transform .2s,background .2s}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.micro{font-size:12px;color:var(--muted);line-height:1.5;margin-top:17px}.ageGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.ageGrid .choice{min-height:145px}.ageGrid .choice strong{font-size:24px}.chips{display:flex;gap:11px;flex-wrap:wrap;max-width:850px}.chip{border:1.5px solid var(--line);padding:15px 18px;background:white;border-radius:40px;color:var(--ink);transition:all .2s}.chip.active{background:var(--accent-light);border-color:var(--accent);font-weight:700}.hint{font-size:13px;color:var(--muted);margin:18px 0}.preview{margin-top:45px;border-top:1px solid var(--line);padding-top:20px;font-size:12px;color:var(--muted)}.preview b{color:var(--ink)}.resultHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 26px}.badge{background:var(--accent-light);color:var(--accent);font-size:12px;font-weight:800;padding:9px 14px;border-radius:30px}.resultIntro{display:grid;grid-template-columns:1.5fr 1fr;align-items:stretch;gap:18px}.resultHero{padding:38px;background:var(--accent-light);border-radius:30px;min-height:240px}.resultHero h1{font-size:clamp(37px,4.5vw,60px);margin-bottom:12px}.resultHero p{font-size:15px;color:var(--muted);max-width:550px;line-height:1.6}.scene{border-radius:30px;background:linear-gradient(145deg,#9fd3b9,#dbeee4 65%,#f6eee3);display:grid;place-items:center;position:relative;overflow:hidden;min-height:240px}.scene:before,.scene:after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;border:1px solid #ffffff99}.scene:before{transform:translate(90px,-55px)}.scene:after{transform:translate(-105px,70px);width:300px;height:300px}.scene span{font-size:100px;filter:drop-shadow(0 14px 12px #1b3d3325);z-index:1}.filterbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:27px 0 17px}.filterbar .tag{background:white}.sectionTitle{display:flex;justify-content:space-between;align-items:baseline;margin:37px 0 18px;gap:10px}.sectionTitle h2{font-size:29px;margin:0}.sectionTitle small{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.event{background:var(--card);border-radius:22px;border:1px solid var(--line);overflow:hidden;transition:transform .2s}.event:hover{transform:translateY(-3px)}.eventArt{height:128px;display:grid;place-items:center;font-size:61px;background:var(--shade,#e3eee7)}.eventBody{padding:18px}.eventBody .kind{color:var(--accent);text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.09em}.eventBody h3{font:600 21px/1.2 'Outfit',sans-serif;margin:9px 0}.eventBody p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 12px}.eventBody .meta{font-size:11px;font-weight:700;color:#4a5e55}.empty{padding:25px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}.footnote{border-top:1px solid var(--line);padding:23px 0;margin-top:45px;font-size:12px;color:var(--muted);line-height:1.6}.tourist{--accent:#255f79;--accent-light:#dfedf2}.tourist .scene{background:linear-gradient(140deg,#81b5d2,#d7eaf1 65%,#f5ecda)}.youth{--accent:#7955a1;--accent-light:#eee4fa}.youth .scene{background:linear-gradient(140deg,#bf9de7,#ebd9f7 65%,#f6e4d7)}.family{--accent:#997037;--accent-light:#f5ebd8}.family .scene{background:linear-gradient(140deg,#f3c780,#f9ebd0 65%,#d9eadf)}@media(max-width:720px){.shell{padding:17px 17px 40px}.navright .tag{display:none}.progress{margin:24px 0}.hero{padding-top:24px}h1{letter-spacing:-1.6px}.optionGrid,.cards{grid-template-columns:1fr}.choice{min-height:115px;padding:20px;flex-direction:row;align-items:center;gap:15px}.choice .ico{font-size:28px}.choice strong{font-size:21px}.ageGrid{grid-template-columns:repeat(2,1fr)}.ageGrid .choice{display:block;min-height:130px}.resultIntro{grid-template-columns:1fr}.resultHero{min-height:0;padding:27px}.scene{min-height:160px}.scene span{font-size:75px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.eventArt{height:90px;font-size:46px}.eventBody{padding:12px}.eventBody h3{font-size:17px}.eventBody p{font-size:11px}.sectionTitle h2{font-size:25px}}@media(max-width:390px){.cards{grid-template-columns:1fr}}
</style></head><body><main class="shell"><header class="nav"><div class="brand">FORM</div><div class="navright"><span class="tag">Lillehammer · konseptdemo</span><button class="restart" id="reset" style="display:none">Start på nytt ↗</button></div></header><div class="progress" id="progress" aria-label="Fremdrift"></div><div id="app" aria-live="polite"></div><footer class="footnote">FORM · Hele byen. For alle. Sammen. &nbsp; · &nbsp; Konseptdemo med oppdiktede eksempeloppføringer, ikke en live arrangementskalender. Ingen data sendes til en server.</footer></main><script>
const DEMO=[
{id:1,title:'Familiedag i museumsområdet',type:'Opplevelse',groups:['familie','turist','innbygger'],ages:['barn','ung','voksen','senior'],topics:['Kultur','Familie'],loc:'Maihaugen-området',when:'Forslag · Sjekk åpningstid',icon:'🏡',shade:'#e9efe4',desc:'Utforsk tradisjoner og spennende historier sammen.'},
{id:2,title:'Utforsk Lillehammer sentrum',type:'Byvandring',groups:['turist','innbygger','familie'],ages:['barn','ung','voksen','senior'],topics:['Ute','Kultur'],loc:'Sentrum',when:'Når det passer',icon:'🏘️',shade:'#e2edf0',desc:'Oppdag små gater, arkitektur og lokale møteplasser.'},
{id:3,title:'Spillkveld med venner',type:'Hva kan vi finne på?',groups:['ungdom','innbygger','familie'],ages:['ung','voksen','barn'],topics:['Sosialt','Gratis'],loc:'Der dere møtes',when:'Når det passer',icon:'🎲',shade:'#ede4f4',desc:'Et enkelt påfunn fra Banditten – inviter noen med.'},
{id:4,title:'Tur med utsikt',type:'Friluftsliv',groups:['turist','innbygger','familie','ungdom'],ages:['barn','ung','voksen','senior'],topics:['Ute','Gratis'],loc:'Lillehammer',when:'Når været passer',icon:'🥾',shade:'#e5eedc',desc:'Finn en lokal turmulighet tilpasset dagsformen.'},
{id:5,title:'Kunst og inspirasjon',type:'Kultur',groups:['turist','innbygger','ungdom'],ages:['ung','voksen','senior'],topics:['Kultur'],loc:'Lillehammer sentrum',when:'Sjekk åpningstid',icon:'🎨',shade:'#f4e8e2',desc:'Utforsk kunst, verksteder og utstillingssteder.'},
{id:6,title:'Aktiviteter med BUA-utstyr',type:'Hva kan vi finne på?',groups:['familie','ungdom','innbygger','turist'],ages:['barn','ung','voksen'],topics:['Ute','Gratis','Familie'],loc:'Lillehammer',when:'Når det passer',icon:'🛷',shade:'#e2ebf3',desc:'Få ideer til aktiviteter og undersøk utstyr hos BUA.'},
{id:7,title:'Musikk i byen',type:'Kulturopplevelser',groups:['turist','innbygger','ungdom'],ages:['ung','voksen','senior'],topics:['Musikk','Sosialt'],loc:'Flere steder',when:'Utforsk muligheter',icon:'🎵',shade:'#f0e8f6',desc:'Oppdag scener, konsertsteder og musikkmiljø.'},
{id:8,title:'Oppdag lokale møteplasser',type:'Sosialt',groups:['innbygger','ungdom','familie'],ages:['ung','voksen','senior'],topics:['Sosialt','Gratis'],loc:'I nærmiljøet',when:'Varierer',icon:'☕',shade:'#efe9dd',desc:'Finn steder der det er lett å treffe andre.'},
{id:9,title:'Historier fra Lillehammer',type:'Severdighet',groups:['turist','innbygger','familie'],ages:['barn','ung','voksen','senior'],topics:['Kultur','Familie'],loc:'Lillehammer',when:'Når det passer',icon:'📜',shade:'#f1e9d8',desc:'Et lite dypdykk i steder og fortellinger fra byen.'}
];
const roles=[{id:'turist',ico:'🧳',title:'Jeg er på besøk',sub:'Oppdag byen med nye øyne'},{id:'innbygger',ico:'🏡',title:'Jeg bor her',sub:'Finn mer av det som skjer rundt deg'},{id:'return',ico:'✨',title:'Som sist',sub:'Fortsett med dine tidligere valg'}];
const ages=[{id:'barn',name:'Barn',sub:'0–12 år'},{id:'ung',name:'Ungdom',sub:'13–17 år'},{id:'voksen',name:'Voksen',sub:'18–66 år'},{id:'senior',name:'Senior',sub:'67+ år'}];
const interests=['Kultur','Ute','Musikk','Sosialt','Gratis','Familie'];
const saved=(()=>{try{return JSON.parse(localStorage.getItem('formDemoProfile')||'null')}catch{return null}})();
let state={step:0,role:null,age:null,topics:[],last:saved};const app=document.getElementById('app');
function put(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});document.getElementById('reset').style.display=state.step?'inline':'none';document.body.className=state.step===3? skin():'';document.getElementById('progress').innerHTML=[0,1,2,3].map(i=>`<span class="${i<=state.step?'on':''}"></span>`).join('')}
function skin(){return state.age==='ung'?'youth':state.role==='turist'?'tourist':state.topics.includes('Familie')||state.age==='barn'?'family':''}
function back(){state.step=Math.max(0,state.step-1);render()}
function next(){state.step++;render()}
function render(){if(state.step===0)return stepRole();if(state.step===1)return stepAge();if(state.step===2)return stepInterests();return stepResult()}
function stepRole(){put(`<section class="stage hero"><div class="eyebrow">Hei, velkommen til Lillehammer</div><h1>Hva vil du oppdage i dag?</h1><p class="lead">Hele byen finnes her. Vi trenger bare å vite hvordan du vil møte den.</p><div class="optionGrid">${roles.map(x=>`<button class="choice ${state.role===x.id?'selected':''} ${x.id==='return'&&!state.last?'disabled':''}" data-role="${x.id}" ${x.id==='return'&&!state.last?'disabled':''}><span class="ico">${x.ico}</span><span><strong>${x.title}</strong><small>${x.sub}${x.id==='return'&&!state.last?' · Tilgjengelig ved neste besøk':''}</small></span></button>`).join('')}</div><p class="micro">«Som sist» bruker bare valg som er lagret lokalt på denne enheten. Du kan starte på nytt når som helst.</p></section>`);document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{let r=b.dataset.role;if(r==='return'&&state.last){state={...state.last,step:3,last:state.last};return render()}state.role=r;state.step=1;render()})}
function stepAge(){put(`<section class="stage hero"><div class="eyebrow">Steg 2 av 3 · Alder</div><h1>Hvilken alder skal vi ta utgangspunkt i?</h1><p class="lead">Det hjelper oss å vise forslag som passer bedre. Du kan fortsatt utforske alt.</p><div class="ageGrid">${ages.map(a=>`<button class="choice ${state.age===a.id?'selected':''}" data-age="${a.id}"><span><strong>${a.name}</strong><small>${a.sub}</small></span></button>`).join('')}</div><div class="actions"><button class="btn secondary" id="back">← Tilbake</button></div><p class="micro">Demoen bruker enkle aldersgrupper, ikke fødselsdato.</p></section>`);document.querySelector('#back').onclick=back;document.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{state.age=b.dataset.age;state.step=2;render()})}
function stepInterests(){put(`<section class="stage hero"><div class="eyebrow">Steg 3 av 3 · Dine interesser</div><h1>Hva frister akkurat nå?</h1><p class="lead">Velg opptil to ting – eller hopp over og utforsk byen uten filter.</p><div class="chips">${interests.map(t=>`<button class="chip ${state.topics.includes(t)?'active':''}" data-topic="${t}" aria-pressed="${state.topics.includes(t)}">${({Kultur:'🎭',Ute:'🌿',Musikk:'🎵',Sosialt:'👋',Gratis:'✨',Familie:'👨‍👩‍👧'})[t]} &nbsp;${t}</button>`).join('')}</div><p class="hint">${state.topics.length} av 2 valgt</p><div class="actions"><button id="show" class="btn">Vis min by →</button><button class="btn secondary" id="back">← Tilbake</button></div></section>`);document.querySelector('#show').onclick=()=>{localStorage.setItem('formDemoProfile',JSON.stringify({role:state.role,age:state.age,topics:state.topics}));next()};document.querySelector('#back').onclick=back;document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{let t=b.dataset.topic;if(state.topics.includes(t))state.topics=state.topics.filter(x=>x!==t);else if(state.topics.length<2)state.topics.push(t);stepInterests()})}
function stepResult(){let skinName=skin();let youth=skinName==='youth',tour=skinName==='tourist',fam=skinName==='family';let title=youth?'Lillehammer er din.':tour?'Oppdag mer enn du forventet.':fam?'Små og store opplevelser.':'Mer å gjøre. Mer å oppdage.';let sub=youth?'Oppdag møteplasser, aktiviteter og ideer til ting dere kan finne på.':tour?'Finn historier, kultur og opplevelser utenfor de vanlige turistløypene.':fam?'Her er ideer til ting dere kan oppleve sammen.':'Arrangementer, møteplasser og spontane påfunn – i samme by.';let emoji=youth?'🛹':tour?'🧳':fam?'🎈':'🦎';let labels=[state.role==='turist'?'På besøk':'Bor her',ages.find(x=>x.id===state.age)?.name,...state.topics].filter(Boolean);let rank=x=>(x.groups.includes(state.role)?4:0)+(x.ages.includes(state.age)?2:0)+state.topics.reduce((n,t)=>n+(x.topics.includes(t)?5:0),0);let list=[...DEMO].sort((a,b)=>rank(b)-rank(a));let selected=state.topics.length?list.filter(x=>state.topics.some(t=>x.topics.includes(t))):list;let count=selected.length;let card=x=>`<article class="event"><div class="eventArt" style="--shade:${x.shade}">${x.icon}</div><div class="eventBody"><span class="kind">${x.type}</span><h3>${x.title}</h3><p>${x.desc}</p><div class="meta">📍 ${x.loc} &nbsp; · &nbsp; ${x.when}</div></div></article>`;put(`<section class="stage"><div class="resultHead"><div class="eyebrow" style="margin:0">Din FORM · Lillehammer</div><div class="badge">Kameleonen · ${youth?'Ungdom':tour?'Turist':fam?'Familie':'Innbygger'}</div></div><div class="resultIntro"><div class="resultHero"><h1>${title}</h1><p>${sub}</p><button class="btn" id="newChoice">Endre mine valg ↗</button></div><div class="scene" aria-label="Illustrasjon av ditt valgte uttrykk"><span>${emoji}</span></div></div><div class="filterbar">${labels.map(x=>`<span class="tag">${x}</span>`).join('')}<button class="restart" id="change">Rediger →</button></div><div class="sectionTitle"><h2>Utvalgt for deg</h2><small>${count} forslag · demodata</small></div><div class="cards">${selected.slice(0,6).map(card).join('')}</div><div class="sectionTitle"><h2>Utforsk mer av byen</h2><small>Også utenfor dine valg</small></div><div class="cards">${list.filter(x=>!selected.slice(0,6).some(y=>x.id===y.id)).slice(0,3).map(card).join('')||'<div class="empty">Du har allerede sett de tilgjengelige eksemplene.</div>'}</div><div class="preview"><b>Bak kulissene:</b> I denne demoen har Blekksprutens «postvesen» allerede kategorisert oppføringene. Kameleonen bytter bare visuelt skin og presenterer passende utvalg. Ingen sanntidsdata eller ekte bookinger.</div></section>`);document.querySelector('#newChoice').onclick=()=>{state.step=0;state.role=null;state.age=null;state.topics=[];render()};document.querySelector('#change').onclick=()=>{state.step=2;render()}}
document.querySelector('#reset').onclick=()=>{state.step=0;state.role=null;state.age=null;state.topics=[];render()};render();
</script></body></html>
