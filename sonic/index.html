<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPIRA · Sonic Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#101519;color:#e2e9e9;font:15px system-ui}main{max-width:650px;margin:auto;padding:18px}h1{font-weight:300;letter-spacing:7px;margin:0}small{color:#91a6ab}canvas{width:100%;aspect-ratio:1;display:block;touch-action:none}label{display:block;margin:12px 0}input,select{width:100%;accent-color:#79c9c1}select,button{background:#222e34;color:#e2e9e9;border:1px solid #52646b;border-radius:9px;padding:12px;font:inherit}button{flex:1}section{display:flex;gap:8px}output{float:right}#voices{min-height:25px}button:focus-visible{outline:2px solid white} .range{position:relative;height:38px;touch-action:none}.range input{position:absolute;left:0;top:0;margin:0;height:38px;pointer-events:none;appearance:none;background:transparent}.range input::-webkit-slider-thumb{appearance:none;width:25px;height:25px;border-radius:50%;background:#79c9c1;pointer-events:auto}.range input::-moz-range-thumb{width:25px;height:25px;border-radius:50%;background:#79c9c1;pointer-events:auto}.track{position:absolute;top:16px;height:6px;width:100%;background:#34464b;border-radius:6px}</style><main><h1>SPIRA</h1><small>Sonic Lab · 0.3 · multitouch</small><canvas id="surface" width="700" height="700" aria-label="Spillbar frekvensspiral"></canvas><div id="voices">Berør flaten</div><label>Matematisk struktur<select id="family"><option value="natural">Natural · heltall</option><option value="phi" selected>Golden ratio · φ</option><option value="pi">Pi · √π</option><option value="fib">Fibonacci</option><option value="metal">Metal · eksperimentell</option><option value="sqrt">Square roots</option></select></label><label>Frekvensområde <output id="rangeLabel">50–1600 Hz</output></label><div class="range"><div class="track" id="track"></div><input id="low" aria-label="Minimum frekvens" type="range" min="0" max="800" value="132"><input id="high" aria-label="Maksimum frekvens" type="range" min="0" max="800" value="632"></div><label>Spiralbevegelse<select id="motion"><option value="locked">Locked · følg spiralbanen</option><option value="free">Free · bytt spiralbane</option></select></label><div id="controls"></div><section><button id="hold">Hold: av</button><button id="stop">Stopp alle</button></section><p><small>Dra for glissando. Flere fingre gir flere stemmer. Stiplede linjer viser oktavfoldede partialtoner. Bruk lavt volum.</small></p></main><script>
const $=id=>document.getElementById(id),c=$('surface'),g=c.getContext('2d'),C=350,R=310,colors=['#7edbd0','#e9b66c','#b69af5','#f18eaa','#8ab6ff','#c3d884','#ef9579','#d5d5ed'];let base=50,oct=5;let ac,master,limiter,hold=false,serial=0;const voices=new Map(),tails=new Set();
const specs=[['count','Antall partialtoner',1,16,1,8],['bright','Klangens lyshet',0,100,1,40],['attack','Attack (s)',.01,3,.01,.08],['decay','Utklingning (s)',.1,12,.1,3],['spread','Individuell utklingning',0,100,1,50],['volume','Volum (%)',0,100,1,20]];
for(const [id,name,min,max,step,value] of specs){let l=document.createElement('label');l.textContent=name;let o=document.createElement('output');o.textContent=value;l.append(o);let i=document.createElement('input');Object.assign(i,{id,type:'range',min,max,step,value});l.append(i);$('controls').append(l);i.oninput=()=>{o.textContent=i.value;refresh()}}
const val=id=>Number($(id).value);
function rangeChange(e){let l=val('low'),h=val('high');if(h-l<25){if(e.target.id==='low')l=h-25;else h=l+25} $('low').value=l;$('high').value=h;base=20*2**(l/100);oct=(h-l)/100;$('rangeLabel').textContent=Math.round(base)+'–'+Math.round(base*2**oct)+' Hz';$('track').style.background='linear-gradient(to right,#34464b '+l/8+'%,#79c9c1 '+l/8+'%,#79c9c1 '+h/8+'%,#34464b '+h/8+'%)';$('stop').click()} $('low').oninput=$('high').oninput=rangeChange;
function angle(e){let b=c.getBoundingClientRect();return Math.atan2((e.clientY-b.top)*700/b.height-C,(e.clientX-b.left)*700/b.width-C)}
function init(){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.05;limiter=ac.createDynamicsCompressor();limiter.threshold.value=-18;limiter.ratio.value=15;master.connect(limiter);limiter.connect(ac.destination)}if(ac.state==='suspended')ac.resume().catch(()=>{})}
function ratio(i){switch($('family').value){case'phi':return ((1+Math.sqrt(5))/2)**i;case'pi':return Math.PI**(i/2);case'fib':{let a=1,b=2;while(i--){[a,b]=[b,a+b]}return a}case'metal':return [1,1.414,1.932,2.546,3.162,3.91,4.76,5.43,6.21,7.12,8.07,9.13,10.4,11.7,13.1,14.8][i];case'sqrt':return Math.sqrt(i+1);default:return i+1}}
function point(t){let a=t*2*Math.PI-Math.PI/2,r=R*Math.exp(-t*.48);return{x:C+r*Math.cos(a),y:C+r*Math.sin(a)}}
function pos(f){let t=Math.log2(f/base),fold=false;if(t>oct||t<0){fold=true;let k=t-Math.floor(t);t=k<=oct?k:Math.max(0,Math.min(oct,t))}return{...point(t),fold}}
function freq(e){let b=c.getBoundingClientRect(),x=(e.clientX-b.left)*700/b.width-C,y=(e.clientY-b.top)*700/b.height-C,r=Math.max(R*Math.exp(-oct*.48),Math.min(R,Math.hypot(x,y))),raw=-Math.log(r/R)/.48,a=((Math.atan2(y,x)+Math.PI/2)/(2*Math.PI)+1)%1;return base*2**Math.max(0,Math.min(oct,Math.round(raw-a)+a))}
function refresh(){if(!ac)return;let t=ac.currentTime;master.gain.setTargetAtTime(val('volume')/100*.35/Math.sqrt(Math.max(1,voices.size+tails.size)),t,.04);for(const v of voices.values()){let weights=v.parts.map((p,i)=>i<val('count')&&v.f*ratio(i)<Math.min(18000,ac.sampleRate*.45)?(i+1)**(-2.5+val('bright')*.02):0),sum=weights.reduce((a,b)=>a+b,0)||1;v.parts.forEach((p,i)=>{p.o.frequency.setTargetAtTime(Math.min(v.f*ratio(i),ac.sampleRate*.45),t,.025);p.g.gain.setTargetAtTime(weights[i]/sum,t,.04)})}}
function start(id,f){if(voices.size+tails.size>=16)return;init();let v={f,color:colors[serial++%colors.length],parts:[],env:ac.createGain()};v.env.gain.value=0;v.env.connect(master);v.env.gain.setTargetAtTime(1,ac.currentTime,val('attack')/3);for(let i=0;i<16;i++){let o=ac.createOscillator(),g=ac.createGain();g.gain.value=0;o.connect(g);g.connect(v.env);o.start();v.parts.push({o,g})}voices.set(id,v);refresh()}
function release(id,force=false){let v=voices.get(id);if(!v)return;voices.delete(id);if(hold&&!force){voices.set('held'+serial++,v);return}let d=force?.08:val('decay'),t=ac.currentTime;v.spectrum=Array.from({length:val('count')},(_,i)=>v.f*ratio(i));v.end=performance.now()+d*1000;v.d=d;tails.add(v);v.parts.forEach((p,i)=>{let pd=d*(1-val('spread')/100*i/16*.9);p.g.gain.cancelScheduledValues(t);p.g.gain.setTargetAtTime(0,t,Math.max(.005,pd/5));p.o.stop(t+d+.1)});setTimeout(()=>{v.env.disconnect();tails.delete(v);refresh()},(d+.2)*1000);refresh()}
c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);start(e.pointerId,freq(e));let v=voices.get(e.pointerId);if(v)v.angle=angle(e)};c.onpointermove=e=>{let v=voices.get(e.pointerId);if(v){let a=angle(e);if($('motion').value==='locked'){let d=a-v.angle;d=Math.atan2(Math.sin(d),Math.cos(d));v.f=base*2**Math.max(0,Math.min(oct,Math.log2(v.f/base)+d/(2*Math.PI)))}else v.f=freq(e);v.angle=a;refresh()}};for(let ev of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(ev,e=>release(e.pointerId));
$('family').onchange=refresh;$('hold').onclick=()=>{hold=!hold;$('hold').textContent='Hold: '+(hold?'på':'av');if(!hold)for(let k of [...voices.keys()])if(typeof k==='string')release(k)};$('stop').onclick=()=>{for(let k of [...voices.keys()])release(k,true);if(ac)for(let v of tails){v.env.gain.cancelScheduledValues(ac.currentTime);v.env.gain.setTargetAtTime(0,ac.currentTime,.015);v.end=0}};document.addEventListener('visibilitychange',()=>{if(document.hidden)$('stop').click()});
function drawVoice(v,a){let p=pos(v.f);g.strokeStyle=g.fillStyle=v.color;let fs=v.spectrum||Array.from({length:val('count')},(_,i)=>v.f*ratio(i));for(let f of fs.slice(1)){if(f>Math.min(18000,ac.sampleRate*.45))continue;let q=pos(f);g.globalAlpha=a*.45;g.setLineDash(q.fold?[5,5]:[]);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke();g.setLineDash([]);g.beginPath();g.arc(q.x,q.y,4,0,7);g.fill()}g.globalAlpha=a;g.beginPath();g.arc(p.x,p.y,8,0,7);g.fill();g.font='17px system-ui';g.fillText(v.f.toFixed(1)+' Hz',p.x+10,p.y-10);g.globalAlpha=1}
function draw(){g.clearRect(0,0,700,700);g.strokeStyle='#29383e';g.lineWidth=1;for(let i=0;i<12;i++){let a=i*Math.PI/6;g.beginPath();g.moveTo(C,C);g.lineTo(C+R*Math.cos(a),C+R*Math.sin(a));g.stroke()}for(let i=0;i<=oct;i++){g.beginPath();g.arc(C,C,R*Math.exp(-i*.48),0,7);g.stroke()}g.strokeStyle='#58777b';g.lineWidth=2;g.beginPath();for(let i=0;i<=1200;i++){let p=point(i/1200*oct);i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)}g.stroke();g.fillStyle='#91a6ab';g.font='14px system-ui';for(let i=0;i<=oct;i++){let p=point(i);g.fillText(Math.round(base*2**i),p.x+8,p.y-6)}for(let v of tails)if(v.end>performance.now())drawVoice(v,.4*(v.end-performance.now())/(v.d*1000));for(let v of voices.values())drawVoice(v,1);$('voices').textContent=[...voices.values()].map(v=>v.f.toFixed(1)+' Hz').join(' · ')||'Berør flaten';requestAnimationFrame(draw)}draw();
</script></html>
