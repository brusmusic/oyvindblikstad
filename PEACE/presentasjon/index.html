<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEACE · Resonance Lab</title><meta name="theme-color" content="#000000">
<style>
:root{color-scheme:dark;--ink:#f4f4ef;--muted:#a6aaa7;--accent:#b5d7cb}*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.shell{min-height:100svh;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:25px clamp(20px,4vw,65px);gap:16px}
.brand[hidden]{visibility:hidden;display:block}.brand{font-size:12px;letter-spacing:.21em;text-transform:uppercase;color:#c9d9d3;text-decoration:none}
.meta{font-size:12px;color:#858d89;letter-spacing:.14em}
main{width:min(1150px,100%);margin:auto;flex:1;display:flex;align-items:center;padding:24px clamp(24px,6vw,80px) 50px}
.slide{width:100%;animation:appear .35s ease both}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.27em;color:#90b6aa;margin-bottom:25px}
h1{font-size:clamp(48px,8vw,112px);letter-spacing:-.065em;line-height:1.03;font-weight:480;margin:0 0 28px;max-width:1000px}
h2{font-size:clamp(24px,3.1vw,43px);line-height:1.25;letter-spacing:-.035em;font-weight:400;color:#d5e4de;max-width:950px;margin:0 0 30px}
.lead{font-size:clamp(17px,2vw,23px);line-height:1.6;color:#c5ccc7;max-width:920px}
.detail{max-width:900px;line-height:1.8;font-size:clamp(17px,2vw,23px);white-space:pre-line;color:#d4ded9}
.detail-title{font-size:clamp(35px,5vw,72px);letter-spacing:-.05em;font-weight:450;margin:0 0 30px}
.eyebrow{color:#8da79e;letter-spacing:.2em;font-size:12px;text-transform:uppercase;margin-bottom:22px}
footer{padding:20px clamp(20px,4vw,65px) 30px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.controls{display:flex;align-items:center;gap:9px}.control{background:#111;border:1px solid #343d38;color:#e4eee8;border-radius:100px;min-width:44px;height:44px}.control:hover{background:#23352c}
.hint{font-size:12px;color:#808b84}.dots{display:flex;gap:6px}.dot{width:5px;height:5px;border-radius:50%;background:#38413b}.dot.active{background:#b5d7cb}
.intro{display:block;width:100%}
.logo-frame{width:100%;height:min(72dvh,720px);border:0;background:#000;border-radius:0}
.intro-copy h1{font-size:clamp(54px,8vw,116px)}.intro-copy .lead{max-width:450px}
.intro-note{font-size:12px;color:#83968c;margin-top:20px}
.notes{margin-top:30px;padding:22px;border:1px solid #28362f;border-radius:12px;max-width:850px;color:#c9d4cd;line-height:1.7}
.notes h3{font-size:13px;color:#9cc2b4;letter-spacing:.14em;text-transform:uppercase}
.toggle-notes{background:transparent;border:1px solid #33443a;color:#bacbc0;border-radius:100px;padding:9px 14px;font-size:12px}
@media(max-width:800px){.intro{grid-template-columns:1fr}.logo-frame{height:min(72dvh,620px)}.intro-copy{order:-1}.hint{display:none}main{align-items:center}header{padding-top:18px}footer{padding-bottom:18px}}
@media(prefers-reduced-motion:reduce){.slide{animation:none}}
.gate{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;padding:24px}.gate[hidden]{display:none}.gate-card{width:min(100%,440px);text-align:center}.gate-card h1{font-size:clamp(42px,7vw,72px);margin-bottom:14px}.gate-card p{color:#a5b2aa;line-height:1.6}.gate-card input{width:100%;padding:16px;margin:18px 0 12px;background:#101713;border:1px solid #526b5c;border-radius:8px;color:#fff;font:inherit}.gate-card button{width:100%;padding:15px;background:#b5d7cb;color:#06100b;border:0;border-radius:8px;font-weight:600}.gate-error{min-height:22px;color:#f4a7a7;font-size:13px}.shell[hidden]{display:none}
</style></head>
<body><section class="gate" id="gate" aria-label="Passordbeskyttet presentasjon"><form class="gate-card" id="gateForm"><div class="eyebrow">RESONANCE LAB</div><h1>PEACE</h1><p>Denne presentasjonen er for inviterte gjester.<br>Skriv inn passordet for å fortsette.</p><input type="password" id="gatePassword" placeholder="Passord" autocomplete="off" required aria-label="Passord"><button type="submit">Åpne presentasjonen</button><p class="gate-error" id="gateError" role="alert"></p></form></section><div class="shell" id="presentation" hidden><header><a class="brand" href="/resonancelab/">RESONANCE LAB</a><span class="meta" id="counter">01 / 10</span></header>
<main id="stage" aria-live="polite"></main>
<footer><div class="dots" id="dots" aria-label="Seksjonsoversikt"></div><span class="hint">← → seksjoner &nbsp; · &nbsp; ↓ fordypning &nbsp; · &nbsp; ↑ tilbake</span><div class="controls"><button class="control" id="prev" aria-label="Forrige seksjon">←</button><button class="control" id="up" aria-label="Tilbake til hovedvisning">↑</button><button class="control" id="down" aria-label="Åpne fordypning">↓</button><button class="control" id="next" aria-label="Neste seksjon">→</button><button class="toggle-notes" id="notesButton">Manus</button></div></footer></div>
<script>
const gate=document.getElementById('gate'),presentation=document.getElementById('presentation');function unlock(){gate.hidden=true;presentation.hidden=false;sessionStorage.setItem('peace-access','yes')}if(sessionStorage.getItem('peace-access')==='yes')unlock();document.getElementById('gateForm').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('gatePassword').value==='Tune1337'){unlock();render()}else{document.getElementById('gateError').textContent='Feil passord. Prøv igjen.';document.getElementById('gatePassword').value=''}});
const slides=[["PEACE","Teknologi som gjør menneskelige møter mer menneskelige.","Et kunstnerisk prosjekt fra Resonance Lab.","Kunsten, lydteknologien og det menneskelige møtet er utgangspunktet. PEACE er en av måtene Resonance Lab ønsker å gjøre erfaringene tilgjengelige på.","Jeg er komponist og musikkprodusent. Gjennom flere år har jeg utviklet lyd som kan oppleves gjennom kroppen. Nå ønsker jeg å vise hva dette kan bli sammen med andre mennesker."],["Behovet for ro","Behovet for ro er stort. Tilgangen til den er ikke alltid enkel.","Hva om vi starter med kroppen – i stedet for å tenke oss til ro?","Mange avspenningsmetoder krever konsentrasjon, pustestyring og mental innsats. PEACE undersøker om kroppslige opplevelser kan gjøre det lettere å finne nærvær. Dette er et kunstnerisk spørsmål, ikke en dokumentert behandlingseffekt.","Når vi trenger ro mest, kan det være vanskelig å konsentrere seg. Jeg ville utforske om vi kan begynne i kroppen og la opplevelsen påvirke hvordan vi er til stede."],["PEACE","En opplevelse av ro gjennom lyd du hører med kroppen.","Kroppslig resonans · Komponerte lydreiser · Trygg menneskelig ledsagelse","Taktile elementer formidler vibrasjon direkte til kroppen. Komponerte lydreiser skaper forløp med rytme og bevegelse. En ledsager rammer inn og følger opp opplevelsen. PEACE er ikke ment for ukontrollert selvutprøving.","PEACE har tre deler: kroppslig resonans, komponerte lydreiser og ledsagelse. Teknologien skal støtte det menneskelige møtet, ikke erstatte det."],["Et økosystem","Bygget rundt menneskelige møter.","App og abonnement · Modulær hardware · Ledsageropplæring · Tilgjengelige opplevelser","Mulige arenaer: kirke, samtalerom, fagmiljøer, HR og arbeidsliv. Inntektsmodeller som skal prøves: programvare, utstyr, kurs og tilrettelagte opplevelser. Salg og selvbruk må avgrenses av sikkerhet og opplæring.","Jeg ser for meg en virksomhet som vokser gjennom menneskene som bruker teknologien, og ikke bare gjennom salg av utstyr."],["Teknologien","Én plattform – fra ferdige lydreiser til egne komposisjoner.","PEACE-appen · Composer Lab · Flerkanals kontroller · MAT / FEET / HANDS / COMPANION","Programvaren genererer separate taktile signaler; hørbar musikk kan gå til hodetelefoner eller høyttalere. Fungerende prototyper finnes. En profesjonell åttekanals kontroller, robust kapsling og uavhengig sikkerhetsvurdering er videre utviklingsmål.","Jeg har bygget både programvare og fysiske prototyper. Neste steg er å gjøre dette til en robust og etterprøvbar løsning andre kan bruke innenfor trygge rammer."],["Opplev PEACE","PEACE må oppleves for å forstås.","01 · Ro — en gradvis introduksjon. 02 · Bevegelse — frekvenser og samspill.","To korte demonstrasjoner fra PEACE-appen, omtrent ett minutt hver. Dette er opplevelsesdemonstrasjoner, ikke tester av klinisk effekt. Ingen direkte maskinvarekontroll fra presentasjonsnettsiden.","Nå vil jeg vise to korte eksempler. Først en rolig opplevelse, deretter hvordan signalene kan bevege seg. Vi demonstrerer en kunstnerisk og sanselig opplevelse, ikke en behandling."],["Mulighetene","Vi starter med fagmiljøene som allerede viser interesse.","Først ledsagere · Deretter arbeidsliv og institusjoner · På sikt Norge og Norden","Hva skiller utforskningen? Implisitt pustemusikk fra Breathing Cycles; minst to uavhengige taktile signaler med små frekvensforskjeller og mulig opplevd emergens; individuell mapping fra personens egen opplevelse. Det finnes forskning på nærliggende fenomener, men den spesifikke metoden og mekanismene er ikke dokumentert. Kontakter er ikke formelle institusjonspartnere.","Jeg vil begynne med interesserte fagpersoner, ikke et åpent massemarked. Det særegne er hvordan jeg komponerer samspillet mellom signalene og undersøker hva som oppleves mellom dem."],["Menneskene","Et kunstnerisk fundament. Et menneskelig fellesskap.","Håndplukkede ledsagere: prest · coach · psykolog · kunstterapeut","En pensjonert spesialist i nevrologi støtter ideen og ønsker å bidra med kritisk faglig blikk og forskningsmetoder, men har ikke validert metoden. Flere fagpersoner er interesserte i videre testing. Kunsten stiller spørsmålene. Forskningen hjelper oss å undersøke dem. Vi tilgjengeliggjør det som er trygt, og søker alltid videre etter flere metoder.","Jeg har bygget det kunstneriske og teknologiske fundamentet. Nå ønsker jeg å bygge laget som kan ta det videre. Jeg har fire håndplukkede ledsagere og nevrologisk fagkompetanse som kan hjelpe oss å stille kritiske spørsmål."],["Kapitalbehov","Fra kunstnerisk prototype til bærekraftig virksomhet.","2 000 000 kr · Foreløpig utgangspunkt for 12 måneder","600 000 kr mennesker og fagkompetanse; 550 000 kr produktutvikling og prototyper; 350 000 kr sikkerhet, testing og forskning; 300 000 kr forretningsutvikling og markedsarbeid; 200 000 kr økonomi, etablering og reserve. Estimater som må kvalitetssikres; ikke en finansieringsforespørsel direkte til Klosser.","To millioner kroner er mitt foreløpige anslag, ikke en ferdig søknad. Jeg ønsker hjelp til å kvalitetssikre planen og finne riktige finansieringskilder, slik at jeg kan bruke tiden på kunstnerisk og teknologisk utvikling – og selvfølgelig være ledsager selv."],["Veien videre","Fra håndbygget prototype til et trygt, transportabelt PEACE-system.","Måned 1–3: etablere · 4–6: utforske · 7–9: forbedre · 10–12: evaluere","Ti prototypesett er et mål, betinget av nødvendig risikovurdering og sikkerhetstesting før utprøving. Parallelt ønskes profesjonelle partnere for elektronikk, firmware, kapsling og produksjon. Ingen dokumenterte behandlingspåstander. Åpen samtale om Klosser kan og vil bidra.","Jeg har en fungerende start, men trenger hjelp til å finne riktig vei videre. Hva tenker dere om dette, og ser dere noen muligheter vi kan utforske sammen?"]];
let current=-1,expanded=false,showNotes=false;
const stage=document.getElementById('stage');
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){
const s=current<0?null:slides[current];stage.replaceChildren();document.querySelector('header .brand').hidden=(current===0);document.getElementById('counter').textContent=(current<0?'0':String(current+1))+' / 10'+(expanded?' · FORDYPNING':'');
const article=el('article','slide');if(current>=0)article.append(el('div','kicker',expanded?'FORDYPNING · '+String(current+1).padStart(2,'0'):String(current+1).padStart(2,'0')+' / 10 · '+s[0]));
if(current<0){const intro=el('div','intro');const frame=el('iframe','logo-frame');frame.src='/resonancelab/?embed=peace';frame.title='Interaktiv Resonance Lab-logo med mixer til høyre';frame.loading='eager';intro.append(frame);article.append(intro);}else if(expanded){article.append(el('h1','detail-title',s[0]),el('p','detail',s[3]));}
else if(current===0){const intro=el('div','intro');const frame=el('iframe','logo-frame');frame.src='/resonancelab/';frame.title='Original interaktiv Resonance Lab-logo og mix';frame.loading='eager';const copy=el('div','intro-copy');copy.append(el('h1','',s[0]),el('h2','',s[1]),el('p','lead',s[2]),el('p','intro-note','Utforsk logoen og MIX · Bruk pil høyre for å fortsette'));intro.append(frame,copy);article.append(intro);}
else{article.append(el('h1','',s[0]),el('h2','',s[1]),el('p','lead',s[2]));}
if(showNotes && current>=0){const n=el('section','notes');n.append(el('h3','', 'Muntlig manus'),el('p','',s[4]));article.append(n);}
stage.append(article);const dots=document.getElementById('dots');dots.replaceChildren();[-1,...slides.map((_,i)=>i)].forEach(i=>{const d=el('span','dot'+(i===current?' active':''));dots.append(d)});
document.getElementById('up').disabled=!expanded;document.getElementById('down').disabled=expanded||current<0;document.getElementById('notesButton').textContent=showNotes?'Skjul manus':'Manus';
history.replaceState(null,'','#'+(current+1)+(expanded?'-mer':''));
}
function move(n){current=Math.max(-1,Math.min(slides.length-1,current+n));expanded=false;render()}
function detail(open){if(current<0)return;expanded=open;render()}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.getElementById('down').onclick=()=>detail(true);document.getElementById('up').onclick=()=>detail(false);
document.getElementById('notesButton').onclick=()=>{showNotes=!showNotes;render()};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowDown')detail(true);if(e.key==='ArrowUp')detail(false)}});
const hash=location.hash.match(/^#(\d+)(-mer)?$/);if(hash){current=Math.min(9,Math.max(-1,Number(hash[1])-1));expanded=current>=0&&Boolean(hash[2])}render();
</script></body></html>
