<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Breath State Beta</title>
    <link rel="stylesheet" href="gate.css">
  </head>
  <body>
    <main class="gate">
      <section class="gate-card">
        <p class="eyebrow">Resonance Lab beta</p>
        <h1>Breath State Test</h1>
        <p class="subline">A private phone-sensor prototype for sensing the current breath state.</p>

        <form id="gateForm" autocomplete="off">
          <label for="accessCode">Access code</label>
          <input id="accessCode" name="accessCode" type="password" inputmode="text" autocomplete="current-password">
          <button type="submit">Open test</button>
          <p class="status" id="status" role="status"></p>
        </form>

        <p class="fineprint">Use Safari on iPhone. Keep the phone on the same secure site when sensor permission appears.</p>
      </section>
    </main>
    <script src="gate.js?v=0.1"></script>
  </body>
</html>
